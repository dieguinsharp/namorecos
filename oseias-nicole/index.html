<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nicole, tenho uma pergunta 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 50%, #ff8fab 100%);
    display: flex; align-items: center; justify-content: center;
    color: #5a1a2e;
  }
  .heart-bg {
    position: fixed; bottom: -40px; font-size: 24px; opacity: .7;
    animation: subir linear forwards; pointer-events: none; z-index: 0;
  }
  @keyframes subir {
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }
  .card {
    position: relative; z-index: 2;
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(6px);
    border-radius: 28px;
    padding: 40px 36px;
    width: min(92vw, 460px);
    text-align: center;
    box-shadow: 0 20px 60px rgba(160, 30, 70, .3);
    animation: entrar .8s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes entrar { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .emoji { font-size: 72px; display: inline-block; animation: pulsar 1.2s infinite; }
  @keyframes pulsar { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  h1 { font-family: 'Pacifico', cursive; font-weight: 400; font-size: 2.2rem; margin: 12px 0 8px; color: #d6336c; }
  p { font-size: 1.05rem; line-height: 1.5; margin-bottom: 8px; }
  .pergunta { font-weight: 700; font-size: 1.35rem; margin: 18px 0 26px; }
  .botoes { display: flex; gap: 16px; justify-content: center; align-items: center; min-height: 60px; }
  button {
    font-family: inherit; font-weight: 700; font-size: 1.1rem;
    border: none; border-radius: 999px; padding: 14px 32px; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  #sim { background: #d6336c; color: #fff; box-shadow: 0 6px 18px rgba(214,51,108,.45); }
  #sim:hover { transform: scale(1.08); }
  #nao { background: #f1f1f1; color: #777; }
  #nao.fugindo { position: fixed; z-index: 5; transition: left .25s, top .25s; }
  .assinatura { margin-top: 26px; font-family: 'Pacifico', cursive; color: #a61e4d; font-size: 1.2rem; }
  .msg-nao { min-height: 22px; margin-top: 14px; font-size: .95rem; color: #a61e4d; font-style: italic; }
  .escondido { display: none; }
  .foto-wrap { position: relative; display: inline-block; margin-bottom: 4px; }
  .foto {
    width: 150px; height: 150px; object-fit: cover; object-position: center 30%;
    border-radius: 50%; border: 5px solid #fff;
    box-shadow: 0 0 0 4px #ff8fab, 0 10px 25px rgba(160,30,70,.35);
  }
  .foto-coracao { position: absolute; right: -4px; bottom: 4px; font-size: 38px; animation: pulsar 1.2s infinite; }
  #final .foto { width: 190px; height: 190px; }
  #btnAlbum {
    margin-top: 22px; background: #fff; color: #d6336c; border: 2px solid #d6336c;
    box-shadow: 0 6px 18px rgba(214,51,108,.25);
  }
  #btnAlbum:hover { background: #d6336c; color: #fff; transform: scale(1.05); }
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(255, 228, 236, .97);
    overflow-y: auto; padding: 24px 18px 40px;
    animation: aparecer .35s ease;
  }
  .overlay.escondido { display: none; }
  @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
  .album-topo { display: flex; align-items: center; justify-content: space-between; max-width: 1000px; margin: 0 auto 18px; }
  .album-topo h2 { font-family: 'Pacifico', cursive; font-weight: 400; color: #d6336c; font-size: 2rem; }
  .fechar {
    background: #d6336c; color: #fff; width: 44px; height: 44px; padding: 0;
    font-size: 1.2rem; border-radius: 50%;
  }
  .grade {
    max-width: 1000px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
  }
  .grade img {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 16px; cursor: pointer;
    border: 4px solid #fff; box-shadow: 0 6px 16px rgba(160,30,70,.2);
    transition: transform .2s;
  }
  .grade img:hover { transform: scale(1.04) rotate(-1deg); }
  .grade .vazio { grid-column: 1 / -1; text-align: center; color: #a61e4d; padding: 40px 0; }
  .lb { background: rgba(30, 5, 15, .94); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .lb.escondido { display: none; }
  .lb img { max-width: 92vw; max-height: 82vh; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .lb .fechar { position: absolute; top: 16px; right: 16px; }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,.2); color: #fff; font-size: 2.4rem; padding: 0;
    width: 52px; height: 52px; line-height: 1; border-radius: 50%;
  }
  .nav:hover { background: rgba(255,255,255,.35); }
  .ant { left: 12px; } .prox { right: 12px; }
  .contador { position: absolute; bottom: 18px; color: #fff; font-weight: 600; }
  #final h1 { font-size: 2.6rem; }
  .data { margin-top: 14px; font-size: .9rem; color: #8a4b5e; }
</style>
</head>
<body>

<div class="card" id="pedido">
  <div class="foto-wrap"><img src="foto.jpg" alt="Oseias e Nicole" class="foto"><span class="foto-coracao">💖</span></div>
  <h1>Oi, Nicole!</h1>
  <p>Faz um tempo que eu queria te dizer uma coisa...</p>
  <p>Você deixa meus dias mais leves, mais engraçados e muito mais bonitos.</p>
  <div class="pergunta">Você quer namorar comigo? 🥺</div>
  <div class="botoes">
    <button id="sim">Sim 💖</button>
    <button id="nao">Não</button>
  </div>
  <div class="msg-nao" id="msgNao"></div>
  <div class="assinatura">— Oseias</div>
</div>

<div class="card escondido" id="final">
  <div class="foto-wrap"><img src="foto.jpg" alt="Oseias e Nicole" class="foto"><span class="foto-coracao">💞</span></div>
  <h1>EBAAAA!</h1>
  <p class="pergunta">Oseias 💘 Nicole</p>
  <p>Agora é oficial! Prometo muitas risadas, carinho e comida boa.</p>
  <p class="data" id="data"></p>
  <button id="btnAlbum">Ver nosso álbum 📸</button>
</div>

<div id="album" class="overlay escondido">
  <div class="album-topo">
    <h2>Nosso álbum 💕</h2>
    <button class="fechar" id="fecharAlbum" aria-label="Fechar">✕</button>
  </div>
  <div class="grade" id="grade"></div>
</div>

<div id="lightbox" class="overlay lb escondido">
  <button class="fechar" id="fecharLb" aria-label="Fechar">✕</button>
  <button class="nav ant" id="ant" aria-label="Anterior">‹</button>
  <img id="lbImg" alt="Foto do álbum">
  <button class="nav prox" id="prox" aria-label="Próxima">›</button>
  <div class="contador" id="contador"></div>
</div>

<script>
  const nao = document.getElementById('nao');
  const sim = document.getElementById('sim');
  const msg = document.getElementById('msgNao');
  const frases = [
    'Tem certeza? 🤨',
    'Pensa melhor... 😢',
    'Esse botão tá com defeito 🙃',
    'Não aceito essa resposta 😤',
    'O "Sim" tá logo ali 👉',
    'Tenta de novo 😏',
    'Você não vai conseguir 😂'
  ];
  let tentativas = 0;
  let escalaSim = 1;

  function fugir(e) {
    if (e) e.preventDefault();
    if (!nao.classList.contains('fugindo')) {
      const r = nao.getBoundingClientRect();
      nao.style.left = r.left + 'px';
      nao.style.top = r.top + 'px';
      nao.classList.add('fugindo');
    }
    const m = 20;
    const maxX = window.innerWidth - nao.offsetWidth - m;
    const maxY = window.innerHeight - nao.offsetHeight - m;
    nao.style.left = Math.max(m, Math.random() * maxX) + 'px';
    nao.style.top = Math.max(m, Math.random() * maxY) + 'px';
    msg.textContent = frases[tentativas % frases.length];
    tentativas++;
    escalaSim = Math.min(escalaSim + 0.12, 2);
    sim.style.transform = `scale(${escalaSim})`;
  }
  nao.addEventListener('mouseenter', fugir);
  nao.addEventListener('touchstart', fugir, { passive: false });
  nao.addEventListener('click', fugir);

  sim.addEventListener('click', () => {
    document.getElementById('pedido').classList.add('escondido');
    nao.classList.add('escondido');
    document.getElementById('final').classList.remove('escondido');
    document.getElementById('data').textContent =
      'Desde ' + new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }) + ' 💕';
    for (let i = 0; i < 60; i++) setTimeout(() => coracao(true), i * 40);
    setInterval(() => coracao(true), 250);
  });

  // ===== Álbum =====
  // Coloque as fotos na pasta "album" e liste os nomes aqui:
  const ALBUM = [
    'foto.jpg',
    'album/1.jpg',
    'album/2.jpg'
  ];

  const album = document.getElementById('album');
  const grade = document.getElementById('grade');
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const contador = document.getElementById('contador');
  let atual = 0;

  function montarGrade() {
    grade.innerHTML = '';
    if (!ALBUM.length) {
      grade.innerHTML = '<p class="vazio">Em breve, muitas fotos aqui 💕</p>';
      return;
    }
    ALBUM.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src; img.loading = 'lazy'; img.alt = 'Foto ' + (i + 1);
      img.addEventListener('click', () => abrirLb(i));
      grade.appendChild(img);
    });
  }
  function abrirLb(i) { atual = i; mostrar(); lb.classList.remove('escondido'); }
  function mostrar() {
    lbImg.src = ALBUM[atual];
    contador.textContent = (atual + 1) + ' / ' + ALBUM.length;
  }
  function passo(d) { atual = (atual + d + ALBUM.length) % ALBUM.length; mostrar(); }

  document.getElementById('btnAlbum').addEventListener('click', () => {
    montarGrade(); album.classList.remove('escondido');
  });
  document.getElementById('fecharAlbum').addEventListener('click', () => album.classList.add('escondido'));
  document.getElementById('fecharLb').addEventListener('click', () => lb.classList.add('escondido'));
  document.getElementById('ant').addEventListener('click', () => passo(-1));
  document.getElementById('prox').addEventListener('click', () => passo(1));
  lb.addEventListener('click', e => { if (e.target === lb) lb.classList.add('escondido'); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('escondido')) {
      if (e.key === 'ArrowLeft') passo(-1);
      if (e.key === 'ArrowRight') passo(1);
      if (e.key === 'Escape') lb.classList.add('escondido');
    } else if (e.key === 'Escape') album.classList.add('escondido');
  });
  let toqueX = null;
  lb.addEventListener('touchstart', e => { toqueX = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', e => {
    if (toqueX === null) return;
    const dx = e.changedTouches[0].clientX - toqueX;
    if (Math.abs(dx) > 50) passo(dx < 0 ? 1 : -1);
    toqueX = null;
  });

  const icones = ['💖','💗','💕','💘','💞','🌸','✨'];
  function coracao(festa) {
    const h = document.createElement('div');
    h.className = 'heart-bg';
    h.textContent = icones[Math.floor(Math.random() * icones.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (festa ? 20 + Math.random() * 30 : 14 + Math.random() * 18) + 'px';
    h.style.animationDuration = (4 + Math.random() * 5) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 9000);
  }
  setInterval(() => coracao(false), 600);
</script>
</body>
</html>
